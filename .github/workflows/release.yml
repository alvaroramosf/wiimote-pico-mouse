name: Release

# Publish by pushing a tag that matches the VERSION file, e.g.:
#   echo "0.1.0" > VERSION && git commit -am "Release 0.1.0"
#   git tag v0.1.0 && git push origin main v0.1.0
# Tags containing a hyphen (v0.1.0-beta) are published as pre-releases.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    name: Verify tag, VERSION and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION file
        run: |
          expected="v$(head -n1 VERSION | tr -d '[:space:]')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($expected)"
            exit 1
          fi
      - name: Host unit tests
        run: make -C tests test

  build:
    name: Build ${{ matrix.board }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [pico2_w, pico_w]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib build-essential python3
      - name: Fetch pico-sdk
        run: |
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1
      - name: Build
        run: |
          cmake -S . -B build -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" -DPICO_BOARD=${{ matrix.board }}
          cmake --build build -j"$(nproc)"
      - name: Name artifact
        run: |
          mkdir dist
          cp build/wiimote_pico_mouse.uf2 "dist/wiimote-pico-mouse-${GITHUB_REF_NAME}-${{ matrix.board }}.uf2"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: dist/*.uf2

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.uf2 > SHA256SUMS.txt
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $version" > notes.md; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md $flags
