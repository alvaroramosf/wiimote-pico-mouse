name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make -C tests test CFLAGS="-std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I../src -Ihost_mocks" LDFLAGS="-lm -fsanitize=address,undefined"

  firmware:
    name: Firmware build (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [pico2_w, pico_w]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib build-essential python3
      - name: Fetch pico-sdk
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1
      - name: Configure
        run: cmake -S . -B build -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" -DPICO_BOARD=${{ matrix.board }}
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: wiimote_pico_mouse-${{ matrix.board }}
          path: build/wiimote_pico_mouse.uf2
